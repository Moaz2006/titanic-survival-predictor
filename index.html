<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توقع نجاة ركاب تيتانيك | ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-center">
            <h1 class="text-2xl font-bold tracking-wide">🚢 نظام التوقع الذكي لتيتانيك</h1>
            <p class="text-blue-200 text-sm mt-2">مبني باستخدام نموذج Machine Learning وسيرفر FastAPI</p>
        </div>

        <form id="predictionForm" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">اسم الراكب كامل</label>
                <input type="text" id="passengerName" value="معاذ وائل" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">رقم الراكب (ID)</label>
                    <input type="number" id="passengerId" value="1" min="1" required
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">الجنس</label>
                    <select id="sex" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition">
                        <option value="1">ذكر</option>
                        <option value="0">أنثى</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">الدرجة</label>
                    <select id="pclass" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500 transition">
                        <option value="1">الأولى</option>
                        <option value="2">الثانية</option>
                        <option value="3">الثالثة</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">العمر</label>
                    <input type="number" id="age" value="22" min="0" max="100" required
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">إخوة/زوجة</label>
                    <input type="number" id="sibsp" value="0" min="0" required
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg shadow-lg hover:shadow-blue-500/20 transition-all duration-200 mt-2">
                تحليل البيانات وتوقع المصير 🔮
            </button>
        </form>

        <div id="resultContainer" class="hidden p-6 border-t border-slate-700 bg-slate-850 text-center">
            <h3 class="text-sm font-medium text-slate-400 mb-2">استجابة نموذج الذكاء الاصطناعي:</h3>
            <div id="resultText" class="text-lg font-bold p-4 rounded-xl"></div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('passengerName').value;
            const id = parseInt(document.getElementById('passengerId').value);
            const sex = parseInt(document.getElementById('sex').value);
            const pclass = parseInt(document.getElementById('pclass').value);
            const age = parseFloat(document.getElementById('age').value);
            const sibsp = parseInt(document.getElementById('sibsp').value);

            const passengerData = {
                PassengerId: id,
                Name: name,
                Pclass: pclass,
                Age: age,
                SibSp: sibsp,
                Parch: 0,
                Sex_1: sex
            };

            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');

            try {
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(passengerData)
                });

                const data = await response.json();
                
                resultContainer.classList.remove('hidden');
                resultText.innerText = data.result;

                if (data.status === 'نجاح') {
                    resultText.className = "text-lg font-bold p-4 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                } else {
                    resultText.className = "text-lg font-bold p-4 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/20";
                }
            } catch (error) {
                resultContainer.classList.remove('hidden');
                resultText.innerText = "عفواً! اتأكد إن سيرفر الـ FastAPI شغال في الـ Terminal";
                resultText.className = "text-lg font-bold p-4 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20";
            }
        });
    </script>
</body>
</html>
